name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./terraform
    env:
      # Read-only credentials: a PR branch can run arbitrary code here, so it must
      # not be able to change Cloudflare resources or rewrite the state.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_READ_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_READ_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      TF_VAR_email_routing_destinations: ${{ secrets.EMAIL_ROUTING_DESTINATIONS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Development Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Lint
        run: tflint

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # Why -lock=false: taking the lock writes a lock file to R2, which the
      # read-only state token cannot do. A plan never writes state, so racing
      # with CD only risks a stale plan, not a corrupted state.
      - name: Terraform Plan
        run: terraform plan -input=false -lock=false
